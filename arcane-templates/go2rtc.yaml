x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/go2rtc.svg
  urls:
    - https://github.com/AlexxIT/go2rtc

services:
  go2rtc:
    image: alexxit/go2rtc
    network_mode: host       # important for WebRTC, HomeKit, UDP cameras
    privileged: true         # only for FFmpeg hardware transcoding
    restart: unless-stopped  # autorestart on fail or config change from WebUI
    environment:
      - TZ=America/Chicago  # timezone in logs
    volumes:
      - go2rtc.data:/config   # folder for go2rtc.yaml file (edit from WebUI)
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/go2rtc.svg

volumes:
  go2rtc.data: