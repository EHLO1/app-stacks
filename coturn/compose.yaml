#-[ PROJECT NAME
name: "coturn"

#-[ SERVICES
services:
  # Caddy - Abused for Certificates
  # Repackaged using Dockerfile to include dns.providers.cloudflare module
  caddy:
    build:
      context: "."
      dockerfile: "./Dockerfile"
    image: "caddy:${CADDY_IMAGE_TAG}"
    container_name: "caddy"
    environment:
      - "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}"
      - "SSL_EMAIL=${SSL_EMAIL}"
    restart: "unless-stopped"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile"
      - "caddy.data:/data"
      - "coturn.certs:/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.jjcasa.net"

  # coturn - TURN Server
  coturn:
    image: "coturn/coturn:${COTURN_IMAGE_TAG}"
    container_name: "coturn"
    depends_on:
      - "caddy"
    network_mode: "host"
    volumes:
      - "coturn.certs:/certs"
    command: >
      -n
      --fingerprint
      --lt-cred-mech
      --external-ip=${EXTERNAL_IP}
      --realm=turn.jjcasa.net
      --listening-port=3478
      --tls-listening-port=443
      --min-port=50000
      --max-port=60000
      --cert=/certs/turn.jjcasa.net.crt
      --pkey=/certs/turn.jjcasa.net.key
      --user=${TURN_USER}:${TURN_PASSWORD}
      --no-cli
      --no-multicast-peers
      --no-tlsv1
      --no-tlsv1_1
      --no-tlsv1_2

#-[ VOLUMES
volumes:
  caddy.data:
  coturn.certs:
