version: '3.8'

services:
  # Postgres - SQL Database
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-17-alpine}
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - outline-backend
    volumes:
      - postgres.data:/var/lib/postgresql/data

  # Valkey - Key/Value Store
  valkey:
    image: valkey/valkey:${VALKEY_IMAGE_TAG:-9-alpine}
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
    networks:
      - outline-backend
    volumes:
      - valkey.data:/data

  # Outline - Team Knowledge Base & Documentation Platform
  outline:
    image: docker.getoutline.com/outlinewiki/outline:${OUTLINE_IMAGE_TAG:-latest}
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure
    environment:
      - REDIS_URL=${REDIS_URL}
      - REDIS_MAX_MEMORY=${REDIS_MAX_MEMORY}
      - URL=${URL}
      - PORT=${PORT}
      - FORCE_HTTPS=${FORCE_HTTPS}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY}
      - RATE_LIMITER_ENABLED=${RATE_LIMITER_ENABLED}
      - RATE_LIMITER_REQUESTS=${RATE_LIMITER_REQUESTS}
      - RATE_LIMITE_DURATION=${RATE_LIMITE_DURATION}
      - SECRET_KEY=${SECRET_KEY}
      - UTILS_SECRET=${UTILS_SECRET}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_CONNECTION_POOL_MIN=${DATABASE_CONNECTION_POOL_MIN}
      - DATABASE_CONNECTION_POOL_MAX=${DATABASE_CONNECTION_POOL_MAX}
      - PGSSLMODE=${PGSSLMODE}
      - FILE_STORAGE=${FILE_STORAGE}
      - FILE_STORAGE_LOCAL_ROOT_DIR=${FILE_STORAGE_LOCAL_ROOT_DIR}
      - FILE_STORAGE_UPLOAD_MAX_SIZE=${FILE_STORAGE_UPLOAD_MAX_SIZE}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_USERNAME_CLAIM=${OIDC_USERNAME_CLAIM}
      - OIDC_DISPLAY_NAME=${OIDC_DISPLAY_NAME}
      - OIDC_SCOPES=${OIDC_SCOPES}
      - NODE_ENV=${NODE_ENV}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      - ENABLE_UPDATES=${ENABLE_UPDATES}
      - LOG_LEVEL=${LOG_LEVEL}
    networks:
      - outline-backend
      - cloudflare-ingress
    volumes:
    - outline.data:/var/lib/outline/data

networks:
  outline-backend:
    driver: overlay
    name: outline-backend
  cloudflare-ingress:
    external: true

volumes:
  postgres.data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=10.0.30.2,rw,noatime,nolock,tcp,timeo=14"
      device: ":/secondary-pool/kc1/outline-postgres-data"
  valkey.data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=10.0.30.2,rw,noatime,nolock,tcp,timeo=14"
      device: ":/secondary-pool/kc1/outline-valkey-data"
  outline.data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=10.0.30.2,rw,noatime,nolock,tcp,timeo=14"
      device: ":/secondary-pool/kc1/outline-data"