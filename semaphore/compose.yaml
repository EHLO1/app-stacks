#-[ PROJECT NAME
name: "semaphore"

#-[ SERVICES
services:
  # Postgres - SQL Database
  postgres:
    image: "postgres:${POSTGRES_IMAGE_TAG}"
    container_name: "postgres"
    environment:
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_DB=${POSTGRES_DB}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-h", "localhost", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: "5s"
      timeout: "5s"
      retries: "10"
    networks:
      - "private"
    restart: "unless-stopped"
    volumes:
      - "postgres.data:/var/lib/postgresql/data"

  # Semaphore UI - Ansible, Terraform Automation UI
  semaphore:
    image: "semaphoreui/semaphore:${SEMAPHORE_IMAGE_TAG}"   # v2.16.51
    container_name: "semaphore"
    depends_on:
      - "postgres"
    env_file: "./.env"
    networks:
      - "cloudflare"
      - "private"
    volumes:
      - "semaphore.data:/var/lib/semaphore"
      - "semaphore.config:/etc/semaphore"
      - "semaphore.tmp:/tmp/semaphore"

#-[ NETWORKS
networks:
  # Public / External Network (Cloudflare Tunnel)
  cloudflare:
    external: true
  # Storage / Backend Network (Not Accessible Externally)
  private:
    driver: "bridge"

#-[ VOLUMES
volumes:
  semaphore.data:
  semaphore.config:
  semaphore.tmp:
  postgres.data:
