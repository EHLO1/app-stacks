#-[ PROJECT NAME
name: caddy-ingress
# https://caddyserver.com/
# https://github.com/caddyserver/caddy

services:
  # Caddy - Dynamic TLS & Reverse Proxy
  caddy-ingress:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: caddy-ingress
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - SSL_EMAIL=${SSL_EMAIL}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 2021:2021
    restart: unless-stopped
    volumes:
      - caddy-ingress.data:/data

volumes:
  caddy-ingress.data:
    name: caddy-ingress.data
