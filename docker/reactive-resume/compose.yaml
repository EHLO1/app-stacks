#-[ PROJECT NAME
name: reactive-resume
# https://rxresu.me/
# https://github.com/amruthpillai/reactive-resume

services:
  # Postgres - SQL Database
  reactive-resume-postgres:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: reactive-resume-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - reactive-resume-backend
      - backup-net
    restart: unless-stopped
    volumes:
      - reactive-resume-postgres.data:/var/lib/postgresql/data

  # Valkey - Key/Value Store
  reactive-resume-valkey:
    image: valkey/valkey:${VALKEY_IMAGE_TAG}
    container_name: reactive-resume-valkey
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
    networks:
      - reactive-resume-backend
    restart: unless-stopped
    volumes:
      - reactive-resume-valkey.data:/data

  # Reactive Resume - OSS Resume Build Tool
  reactive-resume:
    image: amruthpillai/reactive-resume:${REACTIVE_RESUME_IMAGE_TAG}
    container_name: reactive-resume
    depends_on:
      reactive-resume-postgres:
        condition: service_healthy
      reactive-resume-valkey:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL}
      - APP_URL=${APP_URL}
      - TZ=${TZ}
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
      - FLAG_DISABLE_EMAIL_AUTH=${FLAG_DISABLE_EMAIL_AUTH}
      - OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_DISCOVERY_URL=${OAUTH_DISCOVERY_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      # Default Port: 3000
      - cloudflare-ingress
      - reactive-resume-backend
    restart: unless-stopped

networks:
  # Public / External Network (Cloudflare Tunnel)
  cloudflare-ingress:
    external: true
  # Storage / Backend Network (Not Accessible Externally)
  reactive-resume-backend:
    driver: bridge
    name: reactive-resume-backend
  # Internal Network for Backups (Not Accessible Externally)
  backup-net:
    external: true

volumes:
  reactive-resume-postgres.data:
    name: reactive-resume-postgres.data
  reactive-resume-valkey.data:
    name: reactive-resume-valkey.data
