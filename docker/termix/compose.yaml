#-[ PROJECT NAME
name: termix
# https://termix.site/
# https://github.com/Termix-SSH/Termix

services:
  # Termix - Self-hosted SSH and remote desktop management
  termix:
    image: ghcr.io/lukegus/termix:${TERMIX_IMAGE_TAG:-latest}
    container_name: termix
    depends_on:
      - termix-guacd
    environment:
      - PORT=8080
    networks:
      # Default Port: 8080
      - cloudflare-ingress
      - termix-backend
    restart: unless-stopped
    volumes:
      - termix.data:/app/data


  # Guacamole - Open Source RDP
  termix-guacd:
    image: guacamole/guacd:${GUACD_IMAGE_TAG:-1.6.0}     # 1.6.0
    container_name: termix-guacd
    networks:
      # Default Port: 4822
      - termix-backend
    restart: unless-stopped

networks:
  # Public / External Network (Cloudflare Tunnel)
  cloudflare-ingress:
    external: true
  # Storage / Backend Network (Not Accessible Externally)
  termix-backend:
    driver: bridge
    name: termix-backend

volumes:
  termix.data:
    name: termix.data
