#-[ PROJECT NAME
name: homebox
# https://homebox.software
# https://github.com/sysadminsmedia/homebox

services:
  # Postgres - SQL Database
  homebox-postgres:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: homebox-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - homebox-backend
    restart: unless-stopped
    volumes:
      - homebox-postgres.data:/var/lib/postgresql/data

  # HomeBox - Simple home inventory management
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:${HOMEBOX_IMAGE_TAG}
    container_name: homebox
    depends_on:
      homebox-postgres:
        condition: service_healthy
    environment:
      - HBOX_OPTIONS_HOSTNAME=${HBOX_OPTIONS_HOSTNAME}
      - HBOX_OPTIONS_TRUST_PROXY=${HBOX_OPTIONS_TRUST_PROXY}
      - HBOX_MODE=${HBOX_MODE}
      - HBOX_OPTIONS_ALLOW_ANALYTICS=${HBOX_OPTIONS_ALLOW_ANALYTICS}
      - HBOX_WEB_MAX_UPLOAD_SIZE=${HBOX_WEB_MAX_UPLOAD_SIZE}
      - HBOX_AUTH_API_KEY_PEPPER=${HBOX_AUTH_API_KEY_PEPPER}
      - HBOX_LOG_LEVEL=${HBOX_LOG_LEVEL}
      - HBOX_LOG_FORMAT=${HBOX_LOG_FORMAT}
      - HBOX_DATABASE_DRIVER=${HBOX_DATABASE_DRIVER}
      - HBOX_DATABASE_HOST=${HBOX_DATABASE_HOST}
      - HBOX_DATABASE_PORT=${HBOX_DATABASE_PORT}
      - HBOX_DATABASE_USERNAME=${HBOX_DATABASE_USERNAME}
      - HBOX_DATABASE_PASSWORD=${HBOX_DATABASE_PASSWORD}
      - HBOX_DATABASE_DATABASE=${HBOX_DATABASE_DATABASE}
      - HBOX_DATABASE_SSL_MODE=${HBOX_DATABASE_SSL_MODE}
      - HBOX_MAILER_HOST=${HBOX_MAILER_HOST}
      - HBOX_MAILER_PORT=${HBOX_MAILER_PORT}
      - HBOX_MAILER_USERNAME=${HBOX_MAILER_USERNAME}
      - HBOX_MAILER_PASSWORD=${HBOX_MAILER_PASSWORD}
      - HBOX_MAILER_FROM=${HBOX_MAILER_FROM}
      - HBOX_OPTIONS_ALLOW_REGISTRATION=${HBOX_OPTIONS_ALLOW_REGISTRATION}
      - HBOX_OPTIONS_ALLOW_LOCAL_LOGIN=${HBOX_OPTIONS_ALLOW_LOCAL_LOGIN}
      - HBOX_OIDC_ENABLED=${HBOX_OIDC_ENABLED}
      - HBOX_OIDC_ISSUER_URL=${HBOX_OIDC_ISSUER_URL}
      - HBOX_OIDC_CLIENT_ID=${HBOX_OIDC_CLIENT_ID}
      - HBOX_OIDC_CLIENT_SECRET=${HBOX_OIDC_CLIENT_SECRET}
      - HBOX_OIDC_SCOPE=${HBOX_OIDC_SCOPE}
      - HBOX_OIDC_ALLOWED_GROUPS=${HBOX_OIDC_ALLOWED_GROUPS}
      - HBOX_OIDC_AUTO_REDIRECT=${HBOX_OIDC_AUTO_REDIRECT}
      - HBOX_OIDC_VERIFY_EMAIL=${HBOX_OIDC_VERIFY_EMAIL}
      - HBOX_OIDC_BUTTON_TEXT=${HBOX_OIDC_BUTTON_TEXT}
    networks:
      # Default Port: 7745
      - cloudflare-ingress
      - homebox-backend
    restart: unless-stopped
    volumes:
    - homebox.data:/data/

networks:
  # Public / External Network (Cloudflare Tunnel)
  cloudflare-ingress:
    external: true
  # Storage / Backend Network (Not Accessible Externally)
  homebox-backend:
    driver: bridge
    name: homebox-backend

volumes:
  homebox-postgres.data:
    name: homebox-postgres.data
  homebox.data:
    name: homebox.data
