[general]
log_level = "info"
log_format = "json"

[webserver]
url = "https://chat.jjcasa.net"
port = 4000

[operator_api]
enable = true
socket_path = "/tmp/chatto/operator.sock"

[core.assets]
storage_backend = "nats"
max_upload_size = "25MB"
cache.enabled = true

[nats]
replicas = 1
embedded.enabled = false

[nats.client]
url = "nats://chatto-nats:4222"
auth_method = "token"

[auth]
direct_registration = false

[[auth.providers]]
id = "pocket-id"
type = "oidc"
label = "JJCasa ID"
scopes = ["openid", "profile", "email", "groups"]
request_email = true
auto_provision = true

[smtp]
enabled = true
host = "smtp.gmail.com"
port = 587

[video]
enabled = true

[livekit]
enabled = true
url = "wss://livekit.jjcasa.net"
api_key = "chatto"