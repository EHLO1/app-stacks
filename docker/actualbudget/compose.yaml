#-[ PROJECT NAME
name: actualbudget
# https://actualbudget.org
# https://github.com/actualbudget/actual

services:
  # Actual Budget - Personal Finance and Budgeting Tool
  actualbudget:
    image: docker.io/actualbudget/actual-server:${ACTUAL_SERVER_IMAGE_TAG}
    container_name: actualbudget
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      # Uncomment any of the lines below to set configuration options.
      # - ACTUAL_HTTPS_KEY=/data/selfhost.key
      # - ACTUAL_HTTPS_CERT=/data/selfhost.crt
      # - ACTUAL_PORT=5006
      # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
      # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
      # See all options and more details at https://actualbudget.org/docs/config/
      # !! If you are not using any of these options, remove the 'environment:' tag entirely.
    networks:
      # Default Port: 5006
      - cloudflare-ingress
    restart: unless-stopped
    volumes:
      - actualbudget.data:/data
      - ./config.json:/data/config.json:ro

networks:
  # Public / External Network (Cloudflare Tunnel)
  cloudflare-ingress:
    external: true

volumes:
  actualbudget.data:
    name: actualbudget.data
