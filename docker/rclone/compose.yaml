#-[ PROJECT NAME
name: rclone
# https://rclone.org/
# https://github.com/rclone/rclone

services:
  # rclone - Used as a backup and replication system (in my environment)
  rclone:
    image: rclone/rclone:${RCLONE_IMAGE_TAG}
    container_name: rclone
    entrypoint: ["/bin/sh"]
    command: ["/scripts/rclone-entrypoint.sh"]
    environment:
      - RCLONE_S3_BUCKET=${RCLONE_S3_BUCKET}
      - RCLONE_SYNC_INTERVAL=${RCLONE_SYNC_INTERVAL}
      - RCLONE_CONFIG_S3_TYPE=${RCLONE_CONFIG_S3_TYPE}
      - RCLONE_CONFIG_S3_PROVIDER=${RCLONE_CONFIG_S3_PROVIDER}
      - RCLONE_CONFIG_S3_ACCESS_KEY_ID=${RCLONE_CONFIG_S3_ACCESS_KEY_ID}
      - RCLONE_CONFIG_S3_SECRET_ACCESS_KEY=${RCLONE_CONFIG_S3_SECRET_ACCESS_KEY}
      - RCLONE_CONFIG_S3_ENDPOINT=${RCLONE_CONFIG_S3_ENDPOINT}
      - RCLONE_CONFIG_S3_REGION=${RCLONE_CONFIG_S3_REGION}
    healthcheck:
      test: ["CMD-SHELL", "test -f /state/initialized && test -f /tmp/rclone-ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    volumes:
      - ./rclone-entrypoint.sh:/scripts/rclone-entrypoint.sh:ro
      - rclone.state:/state
      - app-one.data:/data/app-one
      - app-two.data:/data/app-two

volumes:
  rclone.state:
    name: rclone.state
  app-one.data:
    name: app-one.data
  app-two.data:
    name: app-two.data
