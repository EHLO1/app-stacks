#-[ PROJECT NAME
name: victoriametrics-grafana
# https://victoriametrics.com/
# https://github.com/victoriametrics/VictoriaMetrics
# https://grafana.com/
# https://github.com/grafana/grafana

services:
  # VictoriaMetrics - Metrics and Timeseries Database; Alternative to Prometheus
  victoriametrics:
    image: victoriametrics/victoria-metrics:${VICTORIAMETRICS_IMAGE_TAG}
    container_name: victoriametrics
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=12M"
    networks:
      # Default Port: 8428
      - victoriametrics-backend
    restart: unless-stopped
    volumes:
      - victoriametrics.data:/storage

  # VictoriaLogs - The family member with too many details
  victorialogs:
    image: victoriametrics/victoria-logs:${VICTORIALOGS_IMAGE_TAG}
    container_name: victorialogs
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=3d"
    networks:
      # Default Port: 9428
      - victoriametrics-backend
    restart: unless-stopped
    volumes:
      - victorialogs.data:/storage

  # VictoriaMetrics Authentication - Adds basic auth
  vmauth:
    image: victoriametrics/vmauth:${VMAUTH_IMAGE_TAG}
    container_name: vmauth
    command:
      - -auth.config=/etc/vmauth/auth.yml
      - -httpListenAddr=:8427
    depends_on:
      - victoriametrics
    environment:
      - VMAUTH_USERNAME=${VMAUTH_USERNAME}
      - VMAUTH_PASSWORD=${VMAUTH_PASSWORD}
    networks:
      # Default Port: 8427
      - caddy-ingress-admin
      - victoriametrics-backend
    restart: unless-stopped
    volumes:
      - ./auth.yml:/etc/vmauth/auth.yml

  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG}
    container_name: grafana
    environment:
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    networks:
      # Default Port: 3000
      - caddy-ingress-admin
      - victoriametrics-backend
    restart: unless-stopped
    volumes:
      - grafana.data:/var/lib/grafana    

networks:
  caddy-ingress-admin:
    external: true
  victoriametrics-backend:
    name: victoriametrics-backend
    driver: bridge

volumes:
  victoriametrics.data:
    name: victoriametrics.data
  victorialogs.data:
    name: victorialogs.data
  grafana.data:
    name: grafana.data
