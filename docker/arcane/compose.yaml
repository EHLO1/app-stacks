#-[ PROJECT NAME
name: arcane
# https://getarcane.app/
# https://github.com/getarcaneapp/arcane

services:
  # Arcane - Modern Docker Management Platform
  arcane:
    image: ghcr.io/getarcaneapp/manager:${ARCANE_IMAGE_TAG}
    container_name: arcane
    depends_on:
      - arcane-caddy
      - arcane-postgres
    environment:
      - PUID=1000
      - PGID=1000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - APP_URL=${APP_URL}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - OIDC_ENABLED=${OIDC_ENABLED}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_SCOPES=${OIDC_SCOPES}
      - OIDC_GROUPS_CLAIM=${OIDC_GROUPS_CLAIM}
      - OIDC_ROLE_MAPPINGS=${OIDC_ROLE_MAPPINGS}
      - OIDC_SKIP_TLS_VERIFY=${OIDC_SKIP_TLS_VERIFY}
      - OIDC_AUTO_REDIRECT_TO_PROVIDER=${OIDC_AUTO_REDIRECT_TO_PROVIDER}
      - OIDC_MERGE_ACCOUNTS=${OIDC_MERGE_ACCOUNTS}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME}
      - OIDC_PROVIDER_LOGO_URL=${OIDC_PROVIDER_LOGO_URL}
      - DATABASE_URL=${DATABASE_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_JSON=${LOG_JSON}
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3552/api/health >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - arcane-cloudflare
      - arcane-cluster
      - arcane-backend
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane.data:/app/data

  # Postgres - SQL Database
  arcane-postgres:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: arcane-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - arcane-backend
    restart: unless-stopped
    volumes:
      - arcane-postgres.data:/var/lib/postgresql/data

  # Cloudflare Tunnel
  arcane-cloudflare:
    image: cloudflare/cloudflared:${CLOUDFLARED_IMAGE_TAG:-latest}
    container_name: arcane-cloudflare
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 10
    networks:
      - arcane-cloudflare
    restart: unless-stopped

  # Caddy - Reverse Proxy for the Arcane Cluster
  arcane-caddy:
    build:
      context: .
      dockerfile: ./caddy/Dockerfile
    container_name: arcane-caddy
    environment:
      - BASE_URL=${BASE_URL}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - SSL_EMAIL=${SSL_EMAIL}
    networks:
      - arcane-cluster
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - arcane-caddy.data:/data

networks:
  arcane-cloudflare:
    driver: bridge
    name: arcane-cloudflare
  arcane-cluster:
    driver: bridge
    name: arcane-cluster
  arcane-backend:
    driver: bridge
    name: arcane-backend

volumes:
  arcane.data:
    name: arcane.data
  arcane-postgres.data:
    name: arcane-postgres.data
  arcane-caddy.data:
    name: arcane-caddy.data
