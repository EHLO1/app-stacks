#-[ PROJECT NAME
name: "n8n"

#-[ ANCHORS
# Main and Worker base configuration for n8n
x-n8n: &service-n8n
  image: "docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG}"
  env_file: "./.env"
  user: "root:root"
  restart: "unless-stopped"
  networks:
    - "cloudflare"
    - "private"

# Task runner base configuration for n8n
x-task-runner: &service-task-runner
  build:
    context: "."
    dockerfile: "./runner/Dockerfile"
  environment:
    - "N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}"
    - "N8N_RUNNERS_TASK_BROKER_URI=${N8N_RUNNERS_TASK_BROKER_URI}"
    - "N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY}"
    - "N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT}"
    - "N8N_RUNNERS_INSECURE_MODE=${N8N_RUNNERS_INSECURE_MODE}"
    - "N8N_RUNNERS_LAUNCHER_LOG_LEVEL=${N8N_RUNNERS_LAUNCHER_LOG_LEVEL}"
  networks:
    - "cloudflare"
    - "private"
  restart: "unless-stopped"
  healthcheck:
    test: ["CMD-SHELL", "pgrep -f 'node.*runner' || exit 1"]
    interval: "10s"
    timeout: "5s"
    retries: "5"
    start_period: "15s"

#-[ SERVICES
services:
  # Postgres - SQL Database
  postgres:
    image: "postgres:${POSTGRES_IMAGE_TAG}"
    container_name: "postgres"
    environment:
      - "POSTGRES_DB=${POSTGRES_DB}"
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      interval: "30s"
      timeout: "20s"
      retries: "3"
    networks:
      - "private"
    restart: "unless-stopped"
    volumes:
      - "postgres.data:/var/lib/postgresql/data"

  # Redis - K/V, Queueing
  redis:
    image: "redis:${REDIS_IMAGE_TAG}"
    container_name: "redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: "1s"
      timeout: "3s"
    networks:
      - "private"
    restart: "unless-stopped"
    volumes:
      - "redis.data:/data"

  # n8n (main) - Low-Code / No-Code Workflow Automation
  n8n:
    <<: *service-n8n
    depends_on:
      postgres:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: "10s"
      timeout: "5s"
      retries: "10"
      start_period: "60s"
    volumes:
      - "n8n.main:/n8n"

  # Task runner for the main n8n instance
  n8n-task-runner:
    <<: *service-task-runner
    depends_on:
      n8n:
        condition: "service_healthy"

  # n8n (webhook)
  n8n-webhook:
    <<: *service-n8n
    command: "webhook"
    depends_on:
      n8n:
        condition: "service_healthy"
      postgres:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: "10s"
      timeout: "5s"
      retries: "10"
      start_period: "30s"
    volumes:
      - "n8n.webhook:/n8n"

  # n8n (worker)
  n8n-worker:
    <<: *service-n8n
    command: "worker"
    depends_on:
      n8n:
        condition: "service_healthy"
      postgres:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: "10s"
      timeout: "5s"
      retries: "10"
      start_period: "30s"
    stop_grace_period: "5m"
    volumes:
      - "n8n.main:/n8n"

  # Task runner for n8n worker instances
  # Must be scaled 1:1 with n8n-worker
  n8n-worker-runner:
    <<: *service-task-runner
    depends_on:
      n8n-worker:
        condition: "service_healthy"
    environment:
      - "N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}"
      - "N8N_RUNNERS_TASK_BROKER_URI=http://n8n-worker:5679"
      - "N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY}"
      - "N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT}"
      - "N8N_RUNNERS_INSECURE_MODE=${N8N_RUNNERS_INSECURE_MODE}"
      - "N8N_RUNNERS_LAUNCHER_LOG_LEVEL=${N8N_RUNNERS_LAUNCHER_LOG_LEVEL}"

  # Custom Container - Used to notify n8n-autoscaler
  redis-monitor:
    build:
      context: "."
      dockerfile: "./monitor/Dockerfile"
    depends_on:
      redis:
        condition: "service_healthy"
    environment:
      - "REDIS_HOST=${REDIS_HOST}"
      - "REDIS_PORT=${REDIS_PORT}"
      - "QUEUE_NAME_PREFIX=${QUEUE_NAME_PREFIX}"
      - "QUEUE_NAME=${QUEUE_NAME}"
      - "POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS}"
      - "LOG_LEVEL=${LOG_LEVEL}"
    networks:
      - "private"
    restart: "unless-stopped"

  # Custom Container - Used to autoscale n8n
  n8n-autoscaler:
    build:
      context: "."
      dockerfile: "./autoscaler/Dockerfile"
      args:
        - REDIS_HOST=${REDIS_HOST}
        - REDIS_PORT=${REDIS_PORT}
        - QUEUE_NAME_PREFIX=${QUEUE_NAME_PREFIX}
        - QUEUE_NAME=${QUEUE_NAME}
        - N8N_WORKER_SERVICE_NAME=${N8N_WORKER_SERVICE_NAME}
        - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
    depends_on:
      redis:
        condition: "service_healthy"
      n8n-worker:
        condition: "service_healthy"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - QUEUE_NAME_PREFIX=${QUEUE_NAME_PREFIX}
      - QUEUE_NAME=${QUEUE_NAME}
      - N8N_WORKER_SERVICE_NAME=${N8N_WORKER_SERVICE_NAME} # Service name in this compose file
      - N8N_WORKER_RUNNER_SERVICE_NAME=${N8N_WORKER_RUNNER_SERVICE_NAME} # Service name in this compose file
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME} # Crucial: Should match your project name
      - COMPOSE_FILE_PATH=/app/docker-compose.yml # Path to compose file in mounted project
      - MIN_REPLICAS=${MIN_REPLICAS}
      - MAX_REPLICAS=${MAX_REPLICAS} # Adjust as needed
      - SCALE_UP_QUEUE_THRESHOLD=${SCALE_UP_QUEUE_THRESHOLD} # Scale up if queue length > 5
      - SCALE_DOWN_QUEUE_THRESHOLD=${SCALE_DOWN_QUEUE_THRESHOLD} # Scale down if queue length < 2
      - POLLING_INTERVAL_SECONDS=${POLLING_INTERVAL_SECONDS} # Check every 30 seconds
      - COOLDOWN_PERIOD_SECONDS=${COOLDOWN_PERIOD_SECONDS} # Wait 3 minutes after a scaling action
      - LOG_LEVEL=${LOG_LEVEL:-INFO} # DEBUG for diagnostics, INFO for production
      - N8N_QUEUE_BULL_GRACEFULSHUTDOWNTIMEOUT=${N8N_QUEUE_BULL_GRACEFULSHUTDOWNTIMEOUT}
      - N8N_GRACEFUL_SHUTDOWN_TIMEOUT=${N8N_GRACEFUL_SHUTDOWN_TIMEOUT}
    networks:
      - "private"
    restart: "unless-stopped"
    volumes:
      # TODO: Explore socket proxy options
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./.env:/app/.env"

#-[ NETWORKS
networks:
  # Public / External Network (Proxied by Caddy)
  cloudflare:
    external: true
  # Storage / Backend Network (Not Accessible Externally)
  private:
    driver: "bridge"

#-[ VOLUMES
volumes:
  postgres.data:
  redis.data:
  n8n.main:
  n8n.webhook:
